name: Release

# D56: a v* tag publishes the alpha release. The images go to ghcr.io with the
# job's own GITHUB_TOKEN (packages: write), so no personal token is involved.
# dist/install.yaml is built with the controller image pinned to the tag and
# attached to a GitHub release (contents: write).
#
# After the first run, each ghcr package is private by default: set it to
# Public and link it to this repository once (package settings), so the
# QUICKSTART can pull without logging in.

on:
  push:
    tags: ['v*']

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/coxswain

jobs:
  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: controller
            dockerfile: Dockerfile
          - name: runner
            dockerfile: cmd/runner/Dockerfile
          - name: model-proxy
            dockerfile: cmd/model-proxy/Dockerfile
          - name: egress-proxy
            dockerfile: cmd/egress-proxy/Dockerfile
          - name: tool-proxy
            dockerfile: cmd/tool-proxy/Dockerfile
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  release:
    name: install.yaml + GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Build dist/install.yaml
        run: make build-installer IMG="${IMAGE_PREFIX}-controller:${GITHUB_REF_NAME}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/install.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --prerelease \
            --generate-notes
