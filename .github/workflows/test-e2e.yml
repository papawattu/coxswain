name: E2E Tests

# D44: the kind e2e stays LOCAL (evidence recorded in PR bodies, as now),
# and the self-hosted kind label has 0 runners, so this workflow used to
# sit 'queued' forever on every push/PR. It is now manual-only: run it
# on a machine with a kind cluster available, then paste the results
# into the PR body.

on:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: e2e
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","kind"]') }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # kind is preinstalled on self-hosted kind VMs; install only for fork PRs on ubuntu-latest
      - name: Install kind (ubuntu-latest only)
        if: github.event.pull_request.head.repo.fork
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          go -C runner mod tidy
          if ! git diff --exit-code -- go.mod go.sum runner/go.mod runner/go.sum; then
            echo "::error::go mod tidy modified go.mod/go.sum; commit the result"
            git diff -- go.mod go.sum runner/go.mod runner/go.sum
            exit 1
          fi
          make test-e2e
