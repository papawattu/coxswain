name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: test
    # D44: unit tests run on GitHub-hosted runners (the self-hosted
    # coxswain-runners label has 0 runners, so these runs sat 'queued'
    # forever). The repo is public, so hosted minutes are free. The kind
    # e2e (test-e2e.yml) stays local per D44.
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          # Go's built-in module and build caches.

      # D44: cache the envtest binaries (etcd + kube-apiserver) so repeated
      # runs on hosted runners do not re-download them. setup-envtest
      # installs them under bin/k8s/<k8s-version>-<goos>-<goarch>/.
      # Keys mirror the Makefile: ENVTEST_K8S_VERSION (the envtest k8s
      # version) and the setup-envtest version derived from the
      # controller-runtime go.mod version (ENVTEST_VERSION).
      - name: Cache envtest binaries
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-k8s-1.34.0-setup-envtest-0.25.0-${{ hashFiles('go.mod') }}
          restore-keys: |
            envtest-${{ runner.os }}-k8s-1.34.0-setup-envtest-0.25.0-
            envtest-${{ runner.os }}-

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          go -C runner mod tidy
          if ! git diff --exit-code -- go.mod go.sum runner/go.mod runner/go.sum; then
            echo "::error::go mod tidy modified go.mod/go.sum; commit the result"
            git diff -- go.mod go.sum runner/go.mod runner/go.sum
            exit 1
          fi

      - name: Running Tests
        run: make test
