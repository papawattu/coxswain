version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # QF1008 ("could remove embedded field from selector") is a style hint
      # that is wrong in two places in cmd/egress-proxy: the relayConn.Read
      # override MUST call r.Conn.SetReadDeadline/r.Conn.Read explicitly
      # (calling r.SetReadDeadline/r.Read would recurse into the promoted
      # method), and clientBuf.Reader.Buffered/Peek are unambiguous there
      # (clientBuf.Buffered would be ambiguous between Reader's and the
      # writer's promoted methods). Exclude the hint for the whole package.
      - linters:
          - staticcheck
        path: cmd/egress-proxy/*
        text: QF1008
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
