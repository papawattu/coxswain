---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: loops.coxswain.wattu.com
spec:
  group: coxswain.wattu.com
  names:
    kind: Loop
    listKind: LoopList
    plural: loops
    singular: loop
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.iteration
      name: Iteration
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Loop is the Schema for the loops API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Loop
            properties:
              goal:
                description: goal is the natural-language objective for this Loop.
                minLength: 1
                type: string
              loop:
                default: {}
                description: loop holds iteration and phase-timeout settings.
                properties:
                  maxIterations:
                    default: 10
                    description: maxIterations caps the plan→implement→verify cycles.
                    minimum: 1
                    type: integer
                type: object
              suspend:
                description: suspend, when true, pauses the Loop at its current phase.
                type: boolean
              verify:
                description: verify declares the acceptance checks (the only gate
                  to Succeeded).
                properties:
                  acceptanceChecks:
                    description: |-
                      acceptanceChecks are user-authored shell commands run in the workspace.
                      Exit code 0 is a pass. These are the ONLY gate that can flip a Loop to
                      Succeeded; their source files are protected paths.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              workspace:
                description: workspace is where the code comes from and how it is
                  authenticated.
                properties:
                  gitCredentialSecret:
                    description: |-
                      gitCredentialSecret is the name of a Secret in the Loop's namespace
                      holding git credentials for pushing the Loop's branch.
                    type: string
                  ref:
                    description: |-
                      ref is the branch, tag, or commit to check out. Defaults to the repo's
                      default branch when empty.
                    type: string
                  repo:
                    description: |-
                      repo is the git URL to clone. Accepts HTTPS (`https://…`), SSH
                      (`ssh://…`), and scp-style (`user@host:path`) remotes — go-git handles
                      all three. Must be non-empty and match the pattern.
                    minLength: 1
                    pattern: ^(https://|ssh://|[A-Za-z0-9._-]+@[A-Za-z0-9.-]+:).+
                    type: string
                required:
                - repo
                type: object
            required:
            - goal
            - workspace
            type: object
          status:
            description: status defines the observed state of Loop
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Loop resource.
                  Each condition has a unique type and reflects the status of a specific
                  aspect of the resource. Status is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredPhase:
                description: |-
                  desiredPhase is the phase the operator has asked the runner to be in.
                  It will also be copied to .coxswain/desired-phase for the runner to read
                  (Phase 1 runner/exec wiring slice, not yet implemented).
                  The operator is the sole writer of Loop status (ADR-0004); the runner
                  never sets this — it only reports observedPhase in result.json.
                enum:
                - Pending
                - Planning
                - AwaitingApproval
                - Implementing
                - Verifying
                - Succeeded
                - Failed
                - Paused
                - CleaningUp
                type: string
              iteration:
                default: 0
                description: iteration is the 1-based count of plan→implement→verify
                  cycles run.
                type: integer
              observedGeneration:
                description: observedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              observedPhase:
                description: |-
                  observedPhase is the operator's record of the phase the runner reported
                  in result.json. It is the input to the transition table (B1). The runner
                  never writes this field directly (ADR-0004).
                enum:
                - Pending
                - Planning
                - AwaitingApproval
                - Implementing
                - Verifying
                - Succeeded
                - Failed
                - Paused
                - CleaningUp
                type: string
              phase:
                default: Pending
                description: phase is the current phase of the state machine.
                enum:
                - Pending
                - Planning
                - AwaitingApproval
                - Implementing
                - Verifying
                - Succeeded
                - Failed
                - Paused
                - CleaningUp
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: Loop name must be a DNS-1035 label of at most 55 characters (it
            names the Sandbox and its Service)
          rule: self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 55
    served: true
    storage: true
    subresources:
      status: {}
