# Dev/kind only: the base install (config/default) plus --allow-unenforced
# AND --allow-unenforced-network. Never use for production — Loops run with
# PolicyEnforced=Unknown (EnforcementUnverified) and, on non-enforcing CNIs
# (kindnet), with NetworkEnforced=False (EnforcementDisabled).
#
# I42c review P2: the egress-proxy NetworkPolicy carve-outs and the I42e
# in-cluster-allow CIDR check need the cluster's pod/service CIDRs. The base
# manifest never sets them, so a deployed operator had an empty except list
# (the carve-outs silently missing) and the CIDR validation disabled. Wire
# them into the manager Deployment here, with the kind defaults (the kind
# cluster's --pod-network-cidr / --service-cluster-ip-range). For a
# non-kind cluster, edit the two values below (or extend deploy-dev to
# pass them) so they match the cluster's actual CIDRs.
resources:
- ../default
patches:
- target:
    kind: Deployment
    name: coxswain-controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --allow-unenforced
    # D38: kindnet does not police pod -> host-network egress (the D38
    # property); the escape hatch lets the Loops run on kindnet dev clusters
    # (NetworkEnforced=False reason EnforcementDisabled). The enforcing-CNI
    # profile (make kind-calico-up) deploys WITHOUT this flag (the base
    # config/default), so the D38 gate is proven there on Calico.
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --allow-unenforced-network
    # S3 (GAP 1): the runner image the operator selects the one-shot runner
    # entrypoint for. When spec.agent.image is empty or equals this value, the
    # operator runs the real runner agent (cmd/runner) instead of the
    # 'sleep infinity' stand-in. Dev/kind only (the runner image is built by
    # make runner-build + kind load); production selects the runner a different
    # way (the S4 phase driver).
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --runner-image=coxswain-runner:dev
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
        - name: POD_CIDR
          value: "10.244.0.0/16"
        - name: SERVICE_CIDR
          value: "10.96.0.0/12"
