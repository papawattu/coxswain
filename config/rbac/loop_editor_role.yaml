# This rule is not used by the project coxswain itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the coxswain.wattu.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: coxswain
    app.kubernetes.io/managed-by: kustomize
  name: loop-editor-role
rules:
- apiGroups:
  - coxswain.wattu.com
  resources:
  - loops
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coxswain.wattu.com
  resources:
  - loops/status
  verbs:
  - get
  # B3 (PLAN-BETA / PLAN.md Phase 4): the CLI's `cox approve` / `cox reject`
  # write the PlanApproved / PlanRejected conditions to the Loop's status
  # subresource (the CLI's write path — client.go Patch sends a JSON merge
  # patch of status.conditions to /status; F87(d) replaced the pre-F87
  # whole-object PUT, which `update` authorised. Both verbs stay granted: the
  # merge patch is authorised by `patch`, and `update` remains for the
  # whole-object status write the CLI no longer makes but other tools may).
  # The editor role grants these writes so an editor-bound user can
  # approve/reject a plan (the operator is the only other writer of
  # the phase; the user owns the two approval conditions). R1 review (CHANGES
  # on #148) P2: the editor role had only `get` on loops/status, so an
  # editor-only user could not approve/reject.
  - update
  - patch
