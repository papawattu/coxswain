# This rule is not used by the project coxswain itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the coxswain.wattu.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: coxswain
    app.kubernetes.io/managed-by: kustomize
  name: loop-editor-role
rules:
- apiGroups:
  - coxswain.wattu.com
  resources:
  - loops
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coxswain.wattu.com
  resources:
  - loops/status
  verbs:
  - get
  # D85 (owner decision, R34): the editor role's loops/status grant went
  # back to GET-ONLY. The CLI's `cox approve` / `cox reject` no longer
  # write the PlanApproved / PlanRejected conditions to the status
  # subresource (the F87/B3 write `patch`/`update` authorised here was the
  # defect: it let an editor-bound user write every status field the
  # operator acts on — phase, checkpoints, budget, verify, agent — the
  # "editor can self-advance" class of R20 I63). The commands now patch the
  # Loop object's METADATA with a one-shot annotation (coxswain.io/approve:
  # <plan sha256> / coxswain.io/reject: <reason>) on the MAIN resource, which
  # the `patch` verb on `loops` above already authorises; the operator
  # consumes the annotation and is now the ONLY writer of the two approval
  # conditions. (A pre-D85 status write still lands on a D85 operator: the
  # conditions the CLI used to set are read back as the operator's own
  # writes and the hold releases — the known-issue documented in
  # UPGRADE.md's v0.1.2 note; this role change is the durable fix.)
  # P6c (D114): a ValidatingAdmissionPolicy now enforces this: no one but the operator's ServiceAccount can write loops/status.
