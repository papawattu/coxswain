apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: coxswain
    app.kubernetes.io/managed-by: kustomize
    coxswain.io/component: memory-writer
  name: coxswain-memory-writer-role
  namespace: system
# P5b: the memory-writer Job's dedicated Role (the plan: "get/list on the
# Loop, create on the Job's pods; no access to the operator's secrets").
# The Job's binary makes no API calls (automountServiceAccountToken: false),
# so these rules are the SA's documented intended scope, not live grants the
# binary exercises. They are deliberately NARROWER than the operator's
# manager-role: no access to Secrets (the operator's git-cred /
# model-creds), no write on the memory PVC or the Loop, no delete.
rules:
  - apiGroups:
      - coxswain.io
    resources:
      - loops
    verbs:
      - get
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
