apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: coxswain
    app.kubernetes.io/managed-by: kustomize
    coxswain.io/component: memory-writer
  name: coxswain-memory-writer
  namespace: system
# P5b: the memory-writer Job's dedicated ServiceAccount (the plan: "runs under
# a dedicated ServiceAccount with RBAC (get/list on the Loop, create on the
# Job's pods; no access to the operator's secrets)"). The Job does NO API
# access (it reads the lessons file from the workspace mount and writes to the
# memory PVC — both mounted volumes, no kubectl/API calls); the pod's
# automountServiceAccountToken is false (no token is mounted, so the Job
# CANNOT make API calls even if the RBAC below were broader). The RBAC here is
# the SA's documented intended scope (get/list on the Loop, create on the
# Job's pods) — it is NARROWER than the operator's manager-role (no access to
# the operator's secrets, no write on the memory PVC, no write on the Loop).
