# D102 (R30, owner decision 2026-11-01): the per-namespace Secret opt-in.
# The operator's ClusterRole (role.yaml) has NO secrets rule at all (the
# D76 confused-deputy fix, part 1): the operator never gets a cluster-wide
# Secret read. This ClusterRole grants get on secrets ONLY, and ships with
# NO binding. An admin enables a NAMESPACE by binding it to the operator's
# ServiceAccount in that namespace:
#
#   kubectl -n <namespace> create rolebinding coxswain-secret-reader \
#     --clusterrole=coxswain-secret-reader \
#     --serviceaccount=<operator-namespace>:<operator-service-account>
#
# (defaults: --clusterrole=coxswain-secret-reader
#  --serviceaccount=coxswain-system:coxswain-controller-manager)
#
# In an enabled namespace the operator can read the named Secrets' METADATA
# (the D76(a) coxswain.io/usable label check, metadata only — a
# PartialObjectMetadata read through the API reader, never the data). In a
# disabled namespace the read is Forbidden and the Loop holds with
# SecretsUsable=False reason NamespaceNotEnabled. See docs/OPERATOR.md and
# docs/UPGRADE.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: coxswain
    app.kubernetes.io/managed-by: kustomize
  name: coxswain-secret-reader
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
