# S2 (samples plan §2): one-shot init for the in-cluster Gitea.
#
# The gitea/gitea:1.24 image has no admin auto-init (that arrived in 1.25),
# so this Job performs the web install: it gates on the gitea service's
# /api/healthz (which answers before the install is complete), then POSTs
# the installer form (creating the admin user from the gitea-admin Secret),
# then verifies the admin credential works against the API.
#
# Idempotent: on a cluster where the install already happened (a surviving
# emptyDir with INSTALL_LOCK=true), the healthz check passes and the Job
# exits 0 without re-running the installer (which 404s on an installed
# instance). The Job runs in the same namespace as the gitea Deployment and
# reaches it via the gitea ClusterIP service — no shared volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-init
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: samples
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: samples
        app.kubernetes.io/component: init
    spec:
      restartPolicy: Never
      containers:
      - name: init
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        # 1. Wait for the gitea service to answer healthz (up to ~120s).
        # 2. If the admin credential already works (installed), exit 0.
        # 3. Otherwise POST the installer form and verify the credential.
        - |
          set -eu
          URL=http://gitea.samples.svc:3000
          AUTH="$ADMIN_USER:$ADMIN_PASS"
          echo "waiting for $URL/api/healthz ..."
          i=0
          while [ $i -lt 60 ]; do
            if curl -fsS -m 3 "$URL/api/healthz" >/dev/null 2>&1; then break; fi
            i=$((i+1)); sleep 2
          done
          curl -fsS -m 3 "$URL/api/healthz" >/dev/null || { echo "gitea did not answer healthz"; exit 1; }
          if curl -fsS -m 5 -u "$AUTH" "$URL/api/v1/version" >/dev/null 2>&1; then
            echo "already installed (admin credential works); nothing to do"
            exit 0
          fi
          echo "running the installer (creating admin user '$ADMIN_USER') ..."
          # The installer POST: Gitea's form field names (from the 1.24
          # install UI). The 200 response is the login page after install.
          curl -sS -m 30 -X POST "$URL/install" \
            -d admin_UserName="$ADMIN_USER" \
            -d admin_Password="$ADMIN_PASS" \
            -d admin_Repeated_Password="$ADMIN_PASS" \
            -d db_type=sqlite3 \
            -d repo_root_url=/data/git \
            -d run_user=git \
            -d domain=samples.svc \
            -d protocol=http \
            -d http_port=3000 \
            -d site_name="S2 Samples" \
            -d disable_registration=true > /tmp/install.out 2>&1
          echo "installer POST: $(head -c 120 /tmp/install.out)"
          # The installer does not wait for the app to come back; poll the
          # admin credential (up to ~120s).
          i=0
          while [ $i -lt 60 ]; do
            if curl -fsS -m 5 -u "$AUTH" "$URL/api/v1/version" >/dev/null 2>&1; then
              echo "install complete; admin credential verified"
              exit 0
            fi
            i=$((i+1)); sleep 2
          done
          echo "installer finished but the admin credential is still rejected"
          exit 1
        env:
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: gitea-admin
              key: username
        - name: ADMIN_PASS
          valueFrom:
            secretKeyRef:
              name: gitea-admin
              key: password
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
