# S2 (samples plan §2): credentials for the in-cluster Gitea.
#
# Two secrets, both values are fixed and committed (disposable dev-only
# credential, kind coxswain-dev only — the kustomization is never part of a
# production install):
#
#   gitea-admin:      the admin user the Gitea image auto-creates on first
#                     boot (GITEA__security__INSTALL_LOCK=1 skips the web
#                     installer; GITEA__admin__* pins the admin account).
#                     Used by `make samples-seed` (Gitea REST API) to create
#                     repos and by `hack/samples-git.sh` for the acceptance
#                     clone check.
#   samples-git-cred: the basic-auth credential for the 'samples' user,
#                     created at seed time via the admin API with a
#                     token-authenticated git http:// access. This is the
#                     secret a sample Loop's spec.workspace.gitCredentialSecret
#                     points at (S3 mounts it into the workspace init
#                     container only — never into the agent container).
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin
type: Opaque
stringData:
  username: admin
  password: gitea-admin
---
apiVersion: v1
kind: Secret
metadata:
  name: samples-git-cred
# kubernetes.io/basic-auth (NOT a bare 'BasicAuth' type — Secret types are
# immutable and the operator's init container mounts it by name; the S5b
# driver recreates a wrong-type secret with this type). The keys must be
# exactly username/password.
type: kubernetes.io/basic-auth
stringData:
  username: samples
  password: samples-git-password
