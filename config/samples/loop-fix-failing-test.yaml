# Example Loop: fix a failing Go test (the simplest possible task).
#
# The gocli sample app (examples/gocli) ships with Round() returning the
# wrong value, so `go test ./...` is red. This Loop tells the agent to fix
# round.go so the tests pass. The test files are protected paths: weakening
# them fails the Loop with TamperedVerify (B2/D24).
#
# Prerequisites (see docs/QUICKSTART.md):
#   - the operator is installed and running
#   - the workspace repo is reachable from the sandbox (for a local dev
#     cluster, use the in-cluster Gitea: http://gitea.samples.svc:3000)
#   - (optional, delivery only) with spec.delivery.mode: PullRequest and a
#     spec.workspace.gitCredentialSecret set, the named Secret is reused by
#     the deliver Job for the git push and the PR API. This sample sets
#     neither, so no credential Secret is required to run it.
#
# Apply:
#   kubectl apply -f config/samples/loop-fix-failing-test.yaml
#
# Watch it:
#   kubectl cox describe loop-fix-failing-test
#   kubectl cox logs loop-fix-failing-test --component agent
#
# Expected outcome (with a working model backend):
#   Planning -> Implementing -> Verifying -> Succeeded
#   status.delivery: the PR the deliver Job opened (or the failure reason).
apiVersion: coxswain.wattu.com/v1alpha1
kind: Loop
metadata:
  name: loop-fix-failing-test
  namespace: default
spec:
  goal: >-
    Fix Round in round.go so it rounds half away from zero. The test suite
    (round_test.go) is currently red and is a protected path: do not change
    or weaken any test file. Make `go test ./...` pass on the tests as written.
  workspace:
    # The seeded in-cluster Gitea repo (hack/samples-seed.sh), so the sample
    # can run as applied. Replace it with your own repo + ref (the workspace
    # the agent clones); set gitCredentialSecret when that repo needs
    # credentials:
    #   repo: "https://github.com/you/your-repo.git"
    #   ref:  "main"
    #   gitCredentialSecret: your-git-cred
    repo: http://gitea.samples.svc:3000/samples/gocli.git
    ref: initial
    gitCredentialSecret: samples-git-cred
  verify:
    acceptanceChecks:
      - go build ./...
      - go vet ./...
      - go test ./...
    preset: go
    # The test files the agent must not modify (the "no cheating" boundary).
    protectedPaths:
      - round_test.go
      - main_test.go
    # The image the verify Job runs the checks in.
    image: docker.io/library/golang:1.26
  agent:
    # image omitted: the operator's --runner-image flag supplies it.
    # endpointSecretRef + modelEndpoint + model point at your model backend.
    # For the dev cluster's vLLM:
    #   endpointSecretRef: vllm-no-auth
    #   modelEndpoint: 192.168.1.20:8000
    #   model: qwen3.8-27b
  loop:
    maxIterations: 3
