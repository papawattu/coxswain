# Example Loop: implement a missing endpoint (a small feature, not a bug fix).
#
# The webapi sample app (examples/webapi) is a tiny Go HTTP server with
# /healthz (works) and /api/v1/ping (missing). This Loop tells the agent to
# implement the /api/v1/ping endpoint so the smoke test passes.
#
# Unlike the fix-a-bug example, this task requires the agent to ADD code
# (not just fix a broken function), so it exercises the full
# Planning -> Implementing -> Verifying cycle with a non-trivial plan.
#
# Apply:
#   kubectl apply -f config/samples/loop-implement-missing-endpoint.yaml
#
# Watch it:
#   kubectl cox describe loop-implement-missing-endpoint
#   kubectl cox plan loop-implement-missing-endpoint   # read the plan
#
# Expected outcome:
#   Planning (the agent writes .coxswain/PLAN.md) ->
#   Implementing (adds the /api/v1/ping handler) ->
#   Verifying (smoke test curls both endpoints) -> Succeeded
apiVersion: coxswain.wattu.com/v1alpha1
kind: Loop
metadata:
  name: loop-implement-missing-endpoint
  namespace: default
spec:
  goal: >-
    Implement the /api/v1/ping endpoint on the existing HTTP server. It
    must return HTTP 200 with a JSON body {"status":"ok"} and a
    Content-Type: application/json header. Do not modify the /healthz
    handler or the smoke test. The smoke test (test/smoke.sh) starts the
    server on a free port, curls /healthz and /api/v1/ping, and expects
    both to return 200 with the correct body.
  workspace:
    # The seeded in-cluster Gitea repo (hack/samples-seed.sh), so the sample
    # can run as applied. Replace it with your own repo + ref (the workspace
    # the agent clones); set gitCredentialSecret when that repo needs
    # credentials:
    #   repo: "https://github.com/you/your-repo.git"
    #   ref:  "main"
    #   gitCredentialSecret: your-git-cred
    repo: http://gitea.samples.svc:3000/samples/webapi.git
    ref: initial
    gitCredentialSecret: samples-git-cred
  verify:
    acceptanceChecks:
      - go build ./...
      - bash test/smoke.sh
    preset: go
    protectedPaths:
      - test/smoke.sh
    # The image the verify Job runs the checks in. test/smoke.sh picks its
    # free port with python3 (examples/webapi/test/smoke.sh:21); a
    # golang-only image has no python3, so the script falls back to a RANDOM
    # port there. Use an image that carries python3 (e.g. a python+go build
    # image) for the reliable path — the golang value below works via the
    # RANDOM fallback in the seeded webapi repo.
    image: docker.io/library/golang:1.26
  agent:
    # image omitted: the operator's --runner-image flag supplies it.
    # endpointSecretRef + modelEndpoint + model point at your model backend.
    # For the coxswain dev cluster's vLLM:
    #   endpointSecretRef: vllm-no-auth
    #   modelEndpoint: 192.168.1.20:8000
    #   model: qwen3.8-27b
  loop:
    maxIterations: 5
