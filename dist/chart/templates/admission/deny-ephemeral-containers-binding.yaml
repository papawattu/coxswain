{{- /*
I45/F45: the ValidatingAdmissionPolicyBinding for the
coxswain-deny-ephemeral-containers VAP (ephemeral-containers-vap.yaml next to
this one). This is the ONLY binding the chart renders: both objects carry the
literal name the kustomize install.yaml produces, so the chart and install.yaml
yield the same pair at any release name. A binding is cluster-scoped, so it
carries no namespace.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: coxswain-deny-ephemeral-containers
spec:
  policyName: coxswain-deny-ephemeral-containers
  validationActions: ["Deny"]
