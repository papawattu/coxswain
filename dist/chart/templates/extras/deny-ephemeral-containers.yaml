apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "coxswain.resourceName" (dict "suffix" "deny-ephemeral-containers" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  policyName: {{ include "coxswain.resourceName" (dict "suffix" "deny-ephemeral-containers" "context" $) }}
  validationActions:
  - Deny
