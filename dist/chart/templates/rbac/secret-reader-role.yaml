apiVersion: rbac.authorization.k8s.io/v1
# D102 (R30, owner decision 2026-11-01): the per-namespace Secret opt-in.
# The manager role (manager-role.yaml / config/rbac/role.yaml) has NO
# secrets rule at all: the operator never gets a cluster-wide Secret read.
# This ClusterRole grants get on secrets ONLY and ships with NO binding. An
# admin enables a NAMESPACE by binding it to the operator's ServiceAccount
# in that namespace (docs/OPERATOR.md + docs/UPGRADE.md give the command):
#
#   kubectl -n <namespace> create rolebinding coxswain-secret-reader \
#     --clusterrole=coxswain-secret-reader \
#     --serviceaccount={{ .Release.Namespace }}:<operator-service-account>
#
# In an enabled namespace the operator reads the named Secrets' METADATA
# only (the D76(a) coxswain.io/usable label check — a PartialObjectMetadata
# read through the API reader, never the data). In a disabled namespace the
# read is Forbidden and the Loop holds with SecretsUsable=False reason
# NamespaceNotEnabled.
kind: ClusterRole
metadata:
  name: coxswain-secret-reader
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
